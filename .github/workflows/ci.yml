name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Build Rust binaries for SDK E2E
        run: cargo build --bin neruton-server --bin neruton

      - name: Upload Rust binaries for SDK E2E
        uses: actions/upload-artifact@v4
        with:
          name: rust-debug-binaries
          path: |
            target/debug/neruton-server
            target/debug/neruton
          if-no-files-found: error
          retention-days: 1

  python-sdk:
    name: Python SDK (test, build)
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Rust binaries for E2E
        uses: actions/download-artifact@v4
        with:
          name: rust-debug-binaries
          path: target/debug

      - name: Mark Rust binaries executable
        run: chmod +x target/debug/neruton-server target/debug/neruton

      - name: Install dependencies
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Run unit and E2E tests
        working-directory: packages/python
        run: python -m pytest -v

      - name: Build sdist and wheel
        working-directory: packages/python
        run: |
          python -m build
          ls -lh dist/
          neruton version
          python -m neruton version

  node-sdk:
    name: Node.js SDK (typecheck, test, pack)
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Rust binaries for E2E
        uses: actions/download-artifact@v4
        with:
          name: rust-debug-binaries
          path: target/debug

      - name: Mark Rust binaries executable
        run: chmod +x target/debug/neruton-server target/debug/neruton

      - name: Install dependencies
        working-directory: packages/node
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build and typecheck
        working-directory: packages/node
        run: |
          npm run build
          npm run typecheck

      - name: Run unit and E2E tests
        working-directory: packages/node
        run: npm test

      - name: Verify npm package tarball
        working-directory: packages/node
        run: npm pack --dry-run

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker:
    name: Docker (build verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        env:
          CLOUDFLARED_TUNNEL_TOKEN: dummy-token-for-ci
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build neruton-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: false
          cache-from: type=gha,scope=neruton-server
          cache-to: type=gha,mode=max,scope=neruton-server

      - name: Build neruton-web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          cache-from: type=gha,scope=neruton-web
          cache-to: type=gha,mode=max,scope=neruton-web
